spring.application.name=pedido-service

server.port=8083

# Banco de dados
spring.datasource.url=jdbc:h2:mem:pedidodb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console-pedido

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.catalogo-service.url=http://localhost:8081
app.cliente-service.url=http://localhost:8082

spring.web.error.include-messages=always

# Logging
logging.level.root=INFO
logging.level.br.com.fiap=DEBUG